name: Daily Green Streak

on:
  schedule:
    # Chạy tự động lúc 01:00 UTC (08:00 sáng giờ VN) mỗi ngày
    - cron: '0 1 * * *'
    # Có thể thêm khung giờ thứ 2 nếu muốn xanh đậm hơn:
    - cron: '30 13 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay để test bất kỳ lúc nào

jobs:
  make-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quyền ghi để có thể commit & push lên repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Update Log & Commit
        run: |
          # 1. Đặt thông tin commit chính xác tài khoản GitHub của bạn
          git config --global user.name "tuananhdangquang869-cloud"
          git config --global user.email "tuananhdangquang869@gmail.com"
          
          # 2. Ghi thời gian hiện tại vào file nhật ký
          mkdir -p .github
          echo "Last active: $(date -u)" >> .github/activity.log
          
          # 3. Stage, commit và push
          git add .github/activity.log
          git commit -m "chore(telemetry): automated daily health check [skip ci]" || exit 0
          git push origin main
